# Web Push und Ausfall Wächter (D029, D030). GitHub Zeitplan alle 10 Minuten zu den Minuten 4, 14, 24 ... wegen
# Cron Verzögerung, zusätzlich startet cron-job.org den Workflow alle 10 Minuten (D041).
# Hier nur die aktuelle Woche. Die Ausfälle der nächsten Woche prüft data.yml einmal pro Stunde (D057).
# Geplante Läufe startet GitHub nur auf dem Default Branch. Manueller Start über workflow_dispatch geht auf jedem Branch.
# Ohne Secrets VAPID_PRIVATE_KEY und PUSH_SUBSCRIPTION bleibt der Lauf grün und sendet nichts.
# Die KI Zweitmeinung (D040, D042) läuft hier am Schluss, damit die Grenze 6 Stunden vor Kickoff getroffen wird.
# Ohne Secret ANTHROPIC_API_KEY bleibt auch dieser Schritt grün und erzeugt nichts.
name: Push und Ausfall Wächter

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "true sendet sofort eine Testnachricht ohne Log Eintrag"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write # für den Start von pages.yml nach neuen Ausfällen

concurrency:
  # Eigene Gruppe, damit lange data.yml Läufe keine Erinnerung verzögern. Die Dateien sind disjunkt zu data.yml
  # (hier nur data/push-log.json, Ausfälle und FPI der aktuellen Woche und data/opinions, data.yml schreibt die
  # der nächsten Woche), Konflikte beim Push löst git pull --rebase.
  group: push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    # Setup rund 2, Wächter höchstens 5, Push höchstens 5, KI Zweitmeinung höchstens 6, Commits je rund 1.
    # Das Job Limit liegt mit Abstand darüber, damit der Meinungscommit nie durch das Job Limit wegfällt (D057).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testnachricht senden
        if: inputs.test == 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: npm run job:push -- --test

      # Der Wächter darf scheitern, die Erinnerungen kommen trotzdem mit dem letzten Stand. Der Lauf wird am Ende rot.
      # Nur die aktuelle Woche, deren Ausfälle in die Meldungen gehen. Schreibt auch den ESPN FPI nach data/fpi.
      # Das Zeitlimit hält den Versand auch bei hängenden Abrufen pünktlich.
      - name: Ausfälle prüfen
        id: watch
        if: inputs.test != 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: npm run job:watch -- --current

      - name: Meldungen senden
        id: push
        if: inputs.test != 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: npm run job:push

      # Nur push-log, Ausfall und FPI Dateien. Pages Neubau nur, wenn sich die Ausfälle der aktuellen Woche
      # geändert haben. Der FPI ist Schattenvergleich und wartet auf den nächsten Neubau (D057).
      - name: Änderungen committen
        id: commit
        if: inputs.test != 'true'
        run: |
          if [ -z "$(git status --porcelain -- data/push-log.json data/injuries data/fpi)" ]; then
            echo "Keine Änderungen an push-log, Ausfällen oder FPI"
            exit 0
          fi
          # Pfad wie injuriesFilePath in src/core/injuries.ts, Woche zweistellig.
          current_injuries=$(node -p 'const c = require("./data/current.json"); `data/injuries/${c.season}-${c.seasonType}-${String(c.week).padStart(2, "0")}.json`' 2>/dev/null || true)
          injuries_changed=false
          if [ -n "$current_injuries" ] && [ -n "$(git status --porcelain -- "$current_injuries")" ]; then
            injuries_changed=true
          fi
          echo "Ausfälle aktuelle Woche ($current_injuries) geändert: $injuries_changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=()
          [ -e data/push-log.json ] && paths+=(data/push-log.json)
          [ -d data/injuries ] && paths+=(data/injuries)
          [ -d data/fpi ] && paths+=(data/fpi)
          git add -A -- "${paths[@]}"
          git commit -m "data: Push Log, Ausfälle und FPI aktualisiert"
          # Bis zu 3 Versuche, falls data.yml gleichzeitig pusht. Ein misslungener Rebase wird abgebrochen und wiederholt.
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              echo "injuries_pushed=$injuries_changed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push Versuch $i fehlgeschlagen, neuer Versuch"
            sleep $((i * 5))
          done
          echo "Push nach 3 Versuchen fehlgeschlagen"
          exit 1

      # Pushes mit GITHUB_TOKEN starten keine push Workflows, daher Pages hier explizit neu bauen, damit die
      # App neue Ausfälle der aktuellen Woche zeigt. Nur auf main, wie in data.yml.
      - name: Pages neu bauen
        if: steps.commit.outputs.injuries_pushed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"

      # KI Zweitmeinung (D040) erst nach dem Versand und dessen Commit, damit sie Erinnerungen nie verzögert.
      # Schattenmodus, nicht in der App sichtbar. Höchstens 4 Spiele pro Lauf, jede Anfrage höchstens 60 Sekunden.
      - name: KI Zweitmeinung
        id: opinion
        if: ${{ !cancelled() && inputs.test != 'true' }}
        timeout-minutes: 6
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run job:opinion

      # Eigener Commit nur für data/opinions, unabhängig vom Push Log. Läuft mit always() auch nach Abbruch oder
      # Zeitüberschreitung, weil jede Meinung und jeder Versuch sofort gespeichert wird. Ginge attempts.json
      # verloren, würde dasselbe Spiel erneut bezahlt (D043, D057). Nach 3 Fehlversuchen wird der Lauf rot.
      - name: Meinungen committen
        id: opinion_commit
        if: ${{ always() && inputs.test != 'true' }}
        run: |
          if [ -z "$(git status --porcelain -- data/opinions)" ]; then
            echo "Keine Änderungen an Meinungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/opinions
          git commit -m "data: KI Zweitmeinungen aktualisiert"
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push Versuch $i fehlgeschlagen, neuer Versuch"
            sleep $((i * 5))
          done
          echo "Push der Meinungen nach 3 Versuchen fehlgeschlagen"
          exit 1

      - name: Fehler melden
        if: ${{ !cancelled() && (steps.watch.outcome == 'failure' || steps.push.outcome == 'failure' || steps.opinion.outcome == 'failure') }}
        run: |
          echo "Wächter: ${{ steps.watch.outcome }}, Meinung: ${{ steps.opinion.outcome }}, Push: ${{ steps.push.outcome }}"
          exit 1

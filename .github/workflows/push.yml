# Web Push und Ausfall Wächter (D029, D030). Läuft alle 10 Minuten auf ungeraden Minuten wegen Cron Verzögerung.
# Geplante Läufe startet GitHub nur auf dem Default Branch. Manueller Start über workflow_dispatch geht auf jedem Branch.
# Ohne Secrets VAPID_PRIVATE_KEY und PUSH_SUBSCRIPTION bleibt der Lauf grün und sendet nichts.
# Die KI Zweitmeinung (D040, D042) läuft hier am Schluss, damit die Grenze 6 Stunden vor Kickoff getroffen wird.
# Ohne Secret ANTHROPIC_API_KEY bleibt auch dieser Schritt grün und erzeugt nichts.
name: Push und Ausfall Wächter

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "true sendet sofort eine Testnachricht ohne Log Eintrag"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write # für den Start von pages.yml nach neuen Ausfällen

concurrency:
  # Eigene Gruppe, damit lange data.yml Läufe keine Erinnerung verzögern. Die Pfade sind disjunkt zu data.yml
  # (hier nur data/push-log.json, data/injuries, data/fpi und data/opinions), Konflikte beim Push löst git pull --rebase.
  group: push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    # Wächter aktuelle Woche höchstens 5, Push, Wächter nächste Woche höchstens 5, KI Zweitmeinung höchstens 6.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testnachricht senden
        if: inputs.test == 'true'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: npm run job:push -- --test

      # Der Wächter darf scheitern, die Erinnerungen kommen trotzdem mit dem letzten Stand. Der Lauf wird am Ende rot.
      # Vor dem Versand nur die aktuelle Woche, deren Ausfälle in die Meldungen gehen. Die nächste Woche (D050)
      # folgt nach dem Versand, damit langsame ESPN Abrufe keine Erinnerung verzögern. Beide schreiben den ESPN FPI
      # nach data/fpi. Das Zeitlimit hält den Versand auch bei hängenden Abrufen pünktlich.
      - name: Ausfälle prüfen
        id: watch
        if: inputs.test != 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: npm run job:watch -- --current

      - name: Meldungen senden
        id: push
        if: inputs.test != 'true'
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: npm run job:push

      - name: Ausfälle nächste Woche prüfen
        id: watch_next
        if: inputs.test != 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: npm run job:watch -- --next

      # Nur push-log, Ausfall und FPI Dateien. Pages Neubau nur, wenn sich Ausfälle geändert haben,
      # der FPI ist Schattenvergleich und wartet auf den nächsten Neubau.
      - name: Änderungen committen
        id: commit
        if: inputs.test != 'true'
        run: |
          if [ -z "$(git status --porcelain -- data/push-log.json data/injuries data/fpi)" ]; then
            echo "Keine Änderungen an push-log, Ausfällen oder FPI"
            exit 0
          fi
          injuries_changed=false
          [ -n "$(git status --porcelain -- data/injuries)" ] && injuries_changed=true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=()
          [ -e data/push-log.json ] && paths+=(data/push-log.json)
          [ -d data/injuries ] && paths+=(data/injuries)
          [ -d data/fpi ] && paths+=(data/fpi)
          git add -A -- "${paths[@]}"
          git commit -m "data: Push Log, Ausfälle und FPI aktualisiert"
          # Bis zu 3 Versuche, falls data.yml gleichzeitig pusht. Ein misslungener Rebase wird abgebrochen und wiederholt.
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              echo "injuries_pushed=$injuries_changed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push Versuch $i fehlgeschlagen, neuer Versuch"
            sleep $((i * 5))
          done
          echo "Push nach 3 Versuchen fehlgeschlagen"
          exit 1

      # Pushes mit GITHUB_TOKEN starten keine push Workflows, daher Pages hier explizit neu bauen, damit die
      # App neue Ausfälle zeigt. Nur auf main, wie in data.yml.
      - name: Pages neu bauen
        if: steps.commit.outputs.injuries_pushed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"

      # KI Zweitmeinung (D040) erst nach dem Versand und dessen Commit, damit sie Erinnerungen nie verzögert.
      # Schattenmodus, nicht in der App sichtbar. Höchstens 4 Spiele pro Lauf, jede Anfrage höchstens 60 Sekunden.
      - name: KI Zweitmeinung
        id: opinion
        if: ${{ !cancelled() && inputs.test != 'true' }}
        timeout-minutes: 6
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run job:opinion

      # Eigener Commit nur für data/opinions, unabhängig vom Push Log. Läuft auch nach Abbruch des Meinungs
      # Schritts, weil jede Meinung sofort gespeichert wird. Nach 3 Fehlversuchen wird der Lauf rot.
      - name: Meinungen committen
        id: opinion_commit
        if: ${{ !cancelled() && inputs.test != 'true' }}
        run: |
          if [ -z "$(git status --porcelain -- data/opinions)" ]; then
            echo "Keine Änderungen an Meinungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/opinions
          git commit -m "data: KI Zweitmeinungen aktualisiert"
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push Versuch $i fehlgeschlagen, neuer Versuch"
            sleep $((i * 5))
          done
          echo "Push der Meinungen nach 3 Versuchen fehlgeschlagen"
          exit 1

      - name: Fehler melden
        if: ${{ !cancelled() && (steps.watch.outcome == 'failure' || steps.watch_next.outcome == 'failure' || steps.push.outcome == 'failure' || steps.opinion.outcome == 'failure') }}
        run: |
          echo "Wächter: ${{ steps.watch.outcome }}, Wächter nächste Woche: ${{ steps.watch_next.outcome }}, Meinung: ${{ steps.opinion.outcome }}, Push: ${{ steps.push.outcome }}"
          exit 1

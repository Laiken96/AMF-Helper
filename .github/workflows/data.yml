# Datenjobs Spielplan (mit den nächsten 2 Wochen), Tipps (aktuelle und kommende Wochen mit Quote), Pick Anteile,
# Ausfälle und FPI der nächsten Woche, Wochenbilanz, News, Lebenszeichen und Wochenindex: holen ESPN, die ESPN News
# Schnittstelle und die RSS Feeds und committen Änderungen unter data/. GitHub Zeitplan Minute 17, zusätzlich
# startet cron-job.org den Workflow stündlich um Minute 47 (D041).
# Ruhende Wochen (Preseason, Pro Bowl, Offseason) schreibt der Spielplan nicht, current.json bleibt dann stehen.
# Geplante Läufe (schedule) startet GitHub nur auf dem Default Branch, also erst nach dem Merge auf main.
# Manueller Start über workflow_dispatch geht auf jedem Branch.
name: Daten Spielplan, Tipps, Bilanz und News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Saison, z. B. 2026 (leer für aktuelle Woche)"
        required: false
      type:
        description: "Saisontyp 1 Preseason, 2 Regular, 3 Postseason (leer für aktuell)"
        required: false
      week:
        description: "Woche (leer für aktuell)"
        required: false

permissions:
  contents: write
  actions: write # für den Start von pages.yml nach neuen Daten

concurrency:
  # Eine gemeinsame Gruppe für alle Auslöser, damit nie zwei Läufe gleichzeitig unter data/ committen.
  # Dadurch kann ein manueller Lauf einen wartenden Cron Lauf verdrängen. Das ist akzeptiert, weil beide dieselbe Arbeit tun.
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    # Bisher rund 2 Minuten, dazu höchstens 5 für die Ausfälle der nächsten Woche.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Alle Datenschritte laufen auch, wenn ein anderer fehlschlägt. Gültige Ergebnisse werden committet,
      # der letzte Schritt macht den Lauf trotzdem rot. Ein fehlgeschlagener Job lässt seine Dateien unverändert.
      - name: Spielplan holen
        id: schedule
        continue-on-error: true
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_TYPE: ${{ inputs.type }}
          IN_WEEK: ${{ inputs.week }}
        run: |
          args=()
          [ -n "$IN_SEASON" ] && args+=(--season "$IN_SEASON")
          [ -n "$IN_TYPE" ] && args+=(--type "$IN_TYPE")
          [ -n "$IN_WEEK" ] && args+=(--week "$IN_WEEK")
          npm run job:schedule -- "${args[@]}"

      # Läuft nach dem Spielplan mit denselben Inputs. Ohne Inputs gilt die Woche aus data/current.json,
      # dazu die kommenden Wochen mit Wochendatei, sobald dort eine Quote existiert (D042).
      - name: Tipps berechnen
        id: tips
        continue-on-error: true
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_TYPE: ${{ inputs.type }}
          IN_WEEK: ${{ inputs.week }}
        run: |
          args=()
          [ -n "$IN_SEASON" ] && args+=(--season "$IN_SEASON")
          [ -n "$IN_TYPE" ] && args+=(--type "$IN_TYPE")
          [ -n "$IN_WEEK" ] && args+=(--week "$IN_WEEK")
          npm run job:tips -- "${args[@]}"

      # Public Pick Prozente (D050), nicht kritisch, endet immer mit Exit 0.
      - name: Pick Anteile holen
        id: picks
        continue-on-error: true
        run: npm run job:picks

      # Ausfälle und FPI der nächsten Woche (D050) einmal pro Stunde statt alle 10 Minuten in push.yml (D057).
      # Nicht zeitkritisch, die Erinnerungen nutzen nur die aktuelle Woche. Nach dem Spielplan, damit ein
      # Wochenwechsel (D055) schon gilt. Eigene Dateien, push.yml schreibt nur die der aktuellen Woche.
      - name: Ausfälle nächste Woche prüfen
        id: watch_next
        timeout-minutes: 5
        continue-on-error: true
        run: npm run job:watch -- --next

      # Wochenbilanz nach den Tipps (D032). Ohne Inputs alle Wochen mit Tippdatei, deren Bilanz fehlt oder offen ist.
      - name: Bilanz berechnen
        id: review
        continue-on-error: true
        run: npm run job:review

      # News aus der ESPN Schnittstelle und RSS (D042, D057). Eine kaputte Quelle blockiert die anderen nicht und
      # erscheint als Warnung im Lauf, rot nur wenn alle scheitern.
      - name: News holen
        id: news
        continue-on-error: true
        run: npm run job:news

      # Lebenszeichen höchstens alle 30 Tage, damit GitHub die Workflows in der Offseason nicht nach 60 Tagen
      # ohne Commit deaktiviert. In der Saison ein kleiner Commit pro Monat.
      - name: Lebenszeichen
        id: heartbeat
        continue-on-error: true
        run: npm run job:heartbeat

      # Zuletzt, damit der Index die Dateien dieses Laufs kennt.
      - name: Wochenindex schreiben
        id: index
        continue-on-error: true
        run: npm run job:index

      - name: Änderungen committen
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Keine Änderungen unter data/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: Daten aktualisiert"
          # Bis zu 3 Versuche, falls push.yml oder standings.yml gleichzeitig pusht.
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push Versuch $i fehlgeschlagen, neuer Versuch"
            sleep $((i * 5))
          done
          echo "Push nach 3 Versuchen fehlgeschlagen"
          exit 1

      # Pushes mit GITHUB_TOKEN starten keine push Workflows, daher Pages hier explizit neu bauen.
      # Default Branch ist main nach dem Merge. github.event.repository ist bei schedule leer, daher fester Name.
      - name: Pages neu bauen
        if: steps.commit.outputs.pushed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"

      - name: Fehler der Datenschritte melden
        if: >-
          steps.schedule.outcome == 'failure' || steps.tips.outcome == 'failure' || steps.review.outcome == 'failure' ||
          steps.news.outcome == 'failure' || steps.index.outcome == 'failure' || steps.heartbeat.outcome == 'failure' ||
          steps.watch_next.outcome == 'failure'
        run: |
          echo "Spielplan: ${{ steps.schedule.outcome }}, Tipps: ${{ steps.tips.outcome }}, Ausfälle nächste Woche: ${{ steps.watch_next.outcome }}, Bilanz: ${{ steps.review.outcome }}, News: ${{ steps.news.outcome }}, Index: ${{ steps.index.outcome }}, Lebenszeichen: ${{ steps.heartbeat.outcome }}"
          exit 1

# Ranglisten Meldung (D032). Nur Kürzel, nie Namen (D022). Labels müssen zu FIELD_LABELS in src/core/standings.ts passen.
name: Rangliste melden
description: Punktestand der Gruppe nach einer Woche, wird von standings.yml übernommen
title: "Rangliste Week "
labels:
  - rangliste
body:
  - type: markdown
    attributes:
      value: Gesamtpunkte laut Tippseite nach der Woche eintragen, nicht die Wochenpunkte.
  - type: input
    id: season
    attributes:
      label: Saison
      value: "2026"
    validations:
      required: true
  - type: input
    id: week
    attributes:
      label: Woche
      description: Stand nach dieser Week, z. B. 9
    validations:
      required: true
  - type: input
    id: ms
    attributes:
      label: MS
      description: Gesamtpunkte
    validations:
      required: true
  - type: input
    id: lm
    attributes:
      label: LM
      description: Gesamtpunkte
    validations:
      required: true
  - type: input
    id: dh
    attributes:
      label: DH
      description: Gesamtpunkte
    validations:
      required: true
  - type: input
    id: cz
    attributes:
      label: CZ
      description: Gesamtpunkte
    validations:
      required: true
  - type: input
    id: ja
    attributes:
      label: JA
      description: Gesamtpunkte
    validations:
      required: true

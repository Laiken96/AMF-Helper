<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Duo zugeklappt Tipps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E13}
a{color:#F5B83D}a:hover{color:#FFD27A}
input.tick{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border-radius:8px;border:2px solid #4A5361;background:transparent;display:grid;place-content:center;cursor:pointer}
input.tick:checked{background:#3DDC97;border-color:#3DDC97}
input.tick:checked::after{content:"";width:11px;height:6px;border-left:3px solid #0B0E13;border-bottom:3px solid #0B0E13;transform:rotate(-45deg) translate(1px,-1px)}
.hero{background:linear-gradient(115deg,#006778 0%,#0B3A44 42%,#1B1235 62%,#3A1F7A 100%)}
</style>
</helmet>
<div style="width: 466px; height: 678px; box-sizing: border-box; background: #0B0E13; color: #F2F4F7; font-family: Inter, system-ui, sans-serif; display: flex; overflow: hidden">
  <main style="width: 382px; flex-shrink: 0; box-sizing: border-box; padding: 12px 10px 34px 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <section class="hero" style="padding: 12px 14px; border-radius: 20px; display: flex; flex-direction: column; gap: 8px" aria-label="Nächster Tippschluss">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #E4E8EE">Fr 02:15 · TNF</span><span style="padding: 4px 10px; border-radius: 999px; background: rgba(11,14,19,0.55); font-size: 12px; font-weight: 700; color: #F5B83D">3 T 21 h</span></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <svg width="72" height="72" viewBox="0 0 140 140" role="img" aria-label="Siegwahrscheinlichkeit JAX 74 Prozent">
          <circle cx="70" cy="70" r="56" fill="none" stroke="#7C5BD6" stroke-width="14"></circle>
          <circle cx="70" cy="70" r="56" fill="none" stroke="#2EC4D6" stroke-width="14" stroke-dasharray="260.4 351.9" transform="rotate(-90 70 70)"></circle>
          <text x="70" y="82" text-anchor="middle" fill="#FFFFFF" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="40">74 %</text>
        </svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; line-height: 1">JAX @ BAL</span>
          <span style="font-size: 13px">Tipp JAX · Resultat 26 : 18</span>
          <span style="font-size: 12px; color: #E4E8EE">BAL ohne L. Jackson</span>
        </div>
      </div>
    </section>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 999px; background: #1C2129">
      <a href="#" style="padding: 8px 0; border-radius: 999px; background: #3A414D; color: #FFFFFF; font-weight: 700; font-size: 13px; text-align: center; text-decoration: none">Offen 12</a>
      <a href="#" style="padding: 8px 0; border-radius: 999px; color: #C9D0DA; font-weight: 600; font-size: 13px; text-align: center; text-decoration: none">Alle 15 · 3 eingetragen</a>
    </div>
    <sc-for list="{{slots}}" as="slot" hint-placeholder-count="2">
      <h2 style="margin: 2px 4px 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.04em; color: #D5DAE1">{{slot.label}}</h2>
      <sc-for list="{{slot.games}}" as="g" hint-placeholder-count="3">
        <article style="padding: 0 4px 0 12px; border-radius: 14px; background: #171B22; display: flex; align-items: center; gap: 8px">
          <span style="width: 10px; height: 10px; border-radius: 5px; background: {{g.color}}; flex-shrink: 0"></span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; width: 44px">{{g.pick}}</span>
          <span style="font-size: 12px; color: #AEB6C2; flex-grow: 1">{{g.vs}}</span>
          <span style="font-size: 12px; font-weight: 600; color: {{g.levelColor}}">{{g.info}}</span>
          <label style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; cursor: pointer"><input class="tick" type="checkbox" checked="{{g.done}}" aria-label="{{g.aria}}"></label>
        </article>
      </sc-for>
    </sc-for>
  </main>
  <aside style="flex-grow: 1; padding: 12px 8px 34px; display: flex; flex-direction: column; align-items: center; gap: 10px" aria-label="System und Navigation">
    <span style="font-size: 14px; font-weight: 700">9:41</span>
    <nav style="margin-top: auto; width: 56px; padding: 8px 0; border-radius: 28px; background: #1C2129; display: flex; flex-direction: column; align-items: center; gap: 6px" aria-label="Hauptnavigation">
      <a href="#" aria-label="Tipps" style="width: 44px; height: 44px; border-radius: 22px; background: #F5B83D; color: #0B0E13; display: grid; place-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg></a>
      <a href="#" aria-label="Bilanz" style="width: 44px; height: 44px; border-radius: 22px; color: #C9D0DA; display: grid; place-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg></a>
      <a href="#" aria-label="Spielplan" style="width: 44px; height: 44px; border-radius: 22px; color: #C9D0DA; display: grid; place-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg></a>
      <a href="#" aria-label="Rangliste" style="width: 44px; height: 44px; border-radius: 22px; color: #C9D0DA; display: grid; place-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg></a>
      <a href="#" aria-label="Mehr" style="width: 44px; height: 44px; border-radius: 22px; color: #C9D0DA; display: grid; place-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></a>
    </nav>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":466,"height":678}}'>
class Component extends DCLogic {
  renderVals() {
    const lv = { klar: '#3DDC97', favorit: '#8FB7FF', unklar: '#F5B83D' };
    const g = (pick, vs, prob, level, color, e) => {
      const x = e || {};
      return { pick, vs, color, done: !!x.done, info: prob ? prob + ' %' : 'offen', levelColor: lv[level] || '#AEB6C2', aria: pick + ' eingetragen' };
    };
    return {
      slots: [
        { label: 'SO 08.11. · 15:30 · 19:00', games: [
          g('CIN', '@ ATL', 59, 'unklar', '#FB4F14', { done: true }), g('KC', 'vs NYJ', 77, 'klar', '#E31837', { done: true }),
          g('DET', '@ MIA', 70, 'favorit', '#0076B6'), g('DAL', '@ IND', 67, 'favorit', '#4B6FA8'),
          g('NO', 'vs CLE', 59, 'unklar', '#D3BC8D'), g('DEN', '@ CAR', 59, 'unklar', '#FB4F14')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
